[project]
name = "wurstbrot-suite"
version = "1.0.0rc1"
description = "Datamine Manager and GE Calculator for War Thunder"
requires-python = ">=3.10"
license = "MIT"

[project.urls]
Repository = "https://github.com/wursti10-cmyk/wurstbrot-suite"

[project.scripts]
wurstbrot = "wurstbrot_core.cli:main"

[tool.setuptools]
packages = ["wurstbrot_core", "wurstbrot_validator"]

[tool.setuptools.package-dir]
wurstbrot_core = "packages/core/wurstbrot_core"
wurstbrot_validator = "packages/validator/wurstbrot_validator"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
