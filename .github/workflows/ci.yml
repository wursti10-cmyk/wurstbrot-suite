name: CI

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e .
      - run: python -m compileall -q packages apps tests
      - run: python run_tests.py
      - run: python tests/regression_matrix.py
      - run: python tests/accuracy_cross_python.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/web_solver.test.mjs
      - run: node tests/browser_regression.mjs
      - run: node tests/browser_shadow_harness.mjs
      - run: node tests/browser_release_hardening.mjs

  datamine-health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          python apps/datamine-manager/wurstbrot_converter.py \
            --validate-database data/samples/WT_Database_2.57.1.67.json \
            --output build/health
      - run: python tests/validate_health_report.py build/health/WT_Health_2.57.1.67.json
      - run: python tests/graph_semantics_matrix.py > build/health/Graph_Semantics_2.57.1.67.json
      - run: python tests/graph_resolution_matrix.py > build/health/Graph_Resolution_2.57.1.67.json
      - run: python tests/graph_cost_matrix.py > build/health/Graph_Cost_2.57.1.67.json
      - run: python tests/graph_shadow_matrix.py --output build/health
      - run: python tests/graph_experimental_matrix.py --output build/health
      - run: python tests/accuracy_core_reference_matrix.py > build/health/Accuracy_Core_References_2.57.1.67.json
      - run: node tests/browser_shadow_harness.mjs --output build/health/Browser_Shadow_2.57.1.67.json
      - run: node tests/browser_release_hardening.mjs --output build/health/Browser_Release_Hardening_2.57.1.67.json
      - run: python tests/regression_matrix.py > build/health/Python_Regression_2.57.1.67.json
      - run: node tests/browser_regression.mjs > build/health/Browser_Regression_2.57.1.67.json
      - run: |
          python tests/accuracy_confidence_matrix.py \
            --shadow-report build/health/Graph_Shadow_2.57.1.67.json \
            --browser-report build/health/Browser_Shadow_2.57.1.67.json \
            --output build/health
      - run: |
          python tests/release_hardening_matrix.py \
            --shadow-report build/health/Graph_Shadow_2.57.1.67.json \
            --experimental-report build/health/Graph_Experimental_2.57.1.67.json \
            --confidence-report build/health/Accuracy_Confidence_2.57.1.67.json \
            --health-report build/health/WT_Health_2.57.1.67.json \
            --browser-report build/health/Browser_Release_Hardening_2.57.1.67.json \
            --python-regression-report build/health/Python_Regression_2.57.1.67.json \
            --browser-regression-report build/health/Browser_Regression_2.57.1.67.json \
            --output build/health
      - uses: actions/upload-artifact@v4
        with:
          name: sample-datamine-health
          path: |
            build/health/WT_Health_2.57.1.67.*
            build/health/Graph_Semantics_2.57.1.67.json
            build/health/Graph_Resolution_2.57.1.67.json
            build/health/Graph_Cost_2.57.1.67.json
            build/health/Graph_Shadow_2.57.1.67.json
            build/health/Graph_Shadow_2.57.1.67.txt
            build/health/Graph_Experimental_2.57.1.67.json
            build/health/Graph_Experimental_2.57.1.67.txt
            build/health/Accuracy_Core_References_2.57.1.67.json
            build/health/Browser_Shadow_2.57.1.67.json
            build/health/Browser_Release_Hardening_2.57.1.67.json
            build/health/Python_Regression_2.57.1.67.json
            build/health/Browser_Regression_2.57.1.67.json
            build/health/Accuracy_Confidence_2.57.1.67.json
            build/health/Accuracy_Confidence_2.57.1.67.txt
            build/health/Accuracy_Release_Hardening_2.57.1.67.json
            build/health/Accuracy_Release_Hardening_2.57.1.67.txt

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: git diff --check ${{ github.event.pull_request.base.sha || github.event.before }}..HEAD
      - run: python tests/markdown_check.py

  package:
    runs-on: ubuntu-latest
    needs: [python, browser, datamine-health, whitespace]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python -m pip install build
      - run: python scripts/build_release.py --clean
      - run: python tests/release_build_acceptance.py --dist dist --output build/release
      - uses: actions/download-artifact@v4
        with:
          name: sample-datamine-health
          path: build/health
      - run: |
          python scripts/rc1_readiness.py \
            --accuracy-report build/health/Accuracy_Release_Hardening_2.57.1.67.json \
            --release-report build/release/Release_Build_Acceptance_1.0.0-rc.1.json \
            --output build/release
      - uses: actions/upload-artifact@v4
        with:
          name: wurstbrot-suite-1.0.0-rc.1
          path: |
            dist/*
            build/release/*
